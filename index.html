<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Flight Mission</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
            touch-action: none; 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas { display: block; }
        
        #ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            z-index: 2; 
        }
        .control-panel { pointer-events: auto; }
        
        #radar { 
            position: absolute; top: 20px; left: 20px; 
            border: 2px solid rgba(255,255,255,0.7); 
            border-radius: 50%; background: rgba(0, 50, 0, 0.4); 
            backdrop-filter: blur(4px);
        }

        #dpad {
            position: absolute; bottom: 30px; left: 30px; 
            display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; gap: 5px; 
        }
        #dpad button {
            background: rgba(255, 255, 255, 0.5); border: none; border-radius: 8px; font-weight: bold; font-size: 20px;
        }
        #dpad button:active { background: #ffaa00; color: #fff; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        
        #throttle { 
            position: absolute; bottom: 30px; left: 200px; 
            display: flex; flex-direction: column; gap: 10px; 
        }
        #throttle button { 
            padding: 15px 25px; font-size: 16px; border-radius: 8px; border: none; 
            background: rgba(255, 255, 255, 0.5); font-weight: bold; transition: 0.1s;
        }
        #throttle button.active { background: #ffaa00; color: #fff; transform: scale(1.05); }
        
        /* 武器ボタンのサイズを調整して3つ並べられるように変更 */
        #weapons { 
            position: absolute; bottom: 30px; right: 30px; 
            display: flex; gap: 10px; 
        }
        #weapons button { 
            width: 70px; height: 70px; border-radius: 50%; font-size: 14px; font-weight: bold; 
            border: 3px solid rgba(255,255,255,0.5); background: rgba(255, 50, 50, 0.7); color: white; 
        }
        #weapons button:active { background: rgba(255, 0, 0, 1); transform: scale(0.95); }

        #gameover { 
            display: none; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center;
            font-size: 48px; color: #ff3333; font-weight: bold; 
            background: rgba(0,0,0,0.8); padding: 40px; border-radius: 15px; 
            pointer-events: auto; text-shadow: 2px 2px 0 #000;
        }
        .retry-btn {
            margin-top: 20px; padding: 10px 30px; font-size: 24px;
            background: #fff; color: #000; border: none; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <canvas id="radar" width="160" height="160" class="control-panel"></canvas>
        
        <div id="dpad" class="control-panel">
            <button id="btn-up">▲</button>
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
            <button id="btn-down">▼</button>
        </div>

        <div id="throttle" class="control-panel">
            <button id="th-3">高速</button>
            <button id="th-2" class="active">中速</button>
            <button id="th-1">低速</button>
        </div>
        
        <div id="weapons" class="control-panel">
            <button id="btn-mg">機銃</button>
            <button id="btn-rocket">ロケット</button>
            <button id="btn-bomb">爆弾</button>
        </div>
        <div id="gameover">
            CRASHED!<br>
            <button class="retry-btn" onclick="location.reload()">再出撃</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- 1. 基本設定とシーン構築 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 100, 1500);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        let isGameOver = false;
        const objects = []; 
        const projectiles = []; 
        const enemyProjectiles = []; 
        const enemies = []; // 追加: 対空砲リスト

        const speeds = { 1: 0.5, 2: 1.5, 3: 3.5 };
        let currentSpeed = speeds[2]; 

        // 追加: ロール（傾き）用に機体の表示部分を分離
        const planeGroup = new THREE.Group();
        const planeVisual = new THREE.Group(); 
        planeGroup.add(planeVisual);
        
        const bodyGeo = new THREE.BoxGeometry(2, 2, 8);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        planeVisual.add(body);

        const wingGeo = new THREE.BoxGeometry(12, 0.5, 2);
        const wingMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const wing = new THREE.Mesh(wingGeo, wingMat);
        wing.position.set(0, 0, 1);
        planeVisual.add(wing);

        const tailGeo = new THREE.BoxGeometry(4, 0.5, 1.5);
        const tail = new THREE.Mesh(tailGeo, wingMat);
        tail.position.set(0, 0, -3.5);
        planeVisual.add(tail);
        
        const finGeo = new THREE.BoxGeometry(0.5, 2, 1.5);
        const fin = new THREE.Mesh(finGeo, wingMat);
        fin.position.set(0, 1, -3.5);
        planeVisual.add(fin);

        scene.add(planeGroup);
        planeGroup.position.set(0, 100, 200);

        // --- 2. マップ（街）と対空砲の生成 ---
        const groundGeo = new THREE.PlaneGeometry(4000, 4000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3b5e2b });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function createBuilding(w, h, d, x, z, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            scene.add(mesh);
            
            const box3 = new THREE.Box3().setFromObject(mesh);
            objects.push({ mesh, box3, isSymbol: color === 0x444444 });

            // 追加: 20%の確率で建物の上に対空砲を配置
            if (color === 0xaaaaaa && Math.random() < 0.2) {
                const aaGeo = new THREE.BoxGeometry(4, 4, 4);
                const aaMat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
                const aaMesh = new THREE.Mesh(aaGeo, aaMat);
                aaMesh.position.set(x, h + 2, z);
                scene.add(aaMesh);

                enemies.push({
                    mesh: aaMesh,
                    box3: new THREE.Box3().setFromObject(aaMesh),
                    active: true,
                    cooldown: Math.random() * 50
                });
            }
        }

        createBuilding(40, 300, 40, -40, 0, 0x444444);
        createBuilding(40, 300, 40, 40, 0, 0x444444);

        for (let i = 0; i < 200; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            if (Math.sqrt(x*x + z*z) < 150) continue;
            
            const w = 10 + Math.random() * 20;
            const h = 10 + Math.random() * 80;
            const d = 10 + Math.random() * 20;
            createBuilding(w, h, d, x, z, 0xaaaaaa);
        }

        // --- 3. UIとコントロール ---
        
        document.getElementById('th-3').addEventListener('touchstart', (e) => setThrottle(3, e));
        document.getElementById('th-2').addEventListener('touchstart', (e) => setThrottle(2, e));
        document.getElementById('th-1').addEventListener('touchstart', (e) => setThrottle(1, e));
        document.getElementById('th-3').addEventListener('mousedown', (e) => setThrottle(3, e));
        document.getElementById('th-2').addEventListener('mousedown', (e) => setThrottle(2, e));
        document.getElementById('th-1').addEventListener('mousedown', (e) => setThrottle(1, e));

        function setThrottle(level, e) {
            if(e) e.preventDefault();
            currentSpeed = speeds[level];
            document.querySelectorAll('#throttle button').forEach(b => b.classList.remove('active'));
            document.getElementById(`th-${level}`).classList.add('active');
        }

        // 追加: 連射用の変数
        let isMGFiring = false;
        let isRocketFiring = false;
        let mgCooldown = 0;
        let rocketCooldown = 0;

        // 武器の長押し設定関数
        const setupWeaponBtn = (id, stateVarSetter) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); stateVarSetter(true); };
            const end = (e) => { e.preventDefault(); stateVarSetter(false); };
            
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        };

        setupWeaponBtn('btn-mg', (v) => isMGFiring = v);
        setupWeaponBtn('btn-rocket', (v) => isRocketFiring = v);

        // 爆弾は単発のまま
        document.getElementById('btn-bomb').addEventListener('touchstart', (e) => { e.preventDefault(); dropBomb(); });
        document.getElementById('btn-bomb').addEventListener('mousedown', (e) => { e.preventDefault(); dropBomb(); });

        function fireMG() {
            if (isGameOver) return;
            const bulletGeo = new THREE.SphereGeometry(0.5, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            bullet.position.copy(planeGroup.position);
            
            const direction = new THREE.Vector3(0, 0, 1);
            direction.applyQuaternion(planeGroup.quaternion);
            
            projectiles.push({ mesh: bullet, velocity: direction.multiplyScalar(15), type: 'mg', life: 100 });
            scene.add(bullet);
        }

        function fireRocket() {
            if (isGameOver) return;
            const rGeo = new THREE.CylinderGeometry(0.5, 0.5, 3, 8);
            const rMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const rocket = new THREE.Mesh(rGeo, rMat);
            rocket.position.copy(planeGroup.position);
            rocket.quaternion.copy(planeGroup.quaternion);
            rocket.rotateX(Math.PI / 2); // 進行方向に向ける
            
            const direction = new THREE.Vector3(0, 0, 1);
            direction.applyQuaternion(planeGroup.quaternion);
            
            projectiles.push({ mesh: rocket, velocity: direction.multiplyScalar(12), type: 'rocket', life: 150 });
            scene.add(rocket);
        }

        function dropBomb() {
            if (isGameOver) return;
            const bombGeo = new THREE.SphereGeometry(1.5, 8, 8);
            const bombMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const bomb = new THREE.Mesh(bombGeo, bombMat);
            bomb.position.copy(planeGroup.position);
            bomb.position.y -= 2;
            
            const direction = new THREE.Vector3(0, 0, 1);
            direction.applyQuaternion(planeGroup.quaternion);
            const vel = direction.multiplyScalar(currentSpeed);
            vel.y = -2;
            
            projectiles.push({ mesh: bomb, velocity: vel, type: 'bomb', life: 200 });
            scene.add(bomb);
        }

        // --- 十字キーでの旋回コントロール ---
        let pitchRate = 0;
        let yawRate = 0;
        const turnSpeed = 0.03; 

        const setupDpad = (id, yRate, pRate) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); yawRate = yRate; pitchRate = pRate; };
            const end = (e) => { e.preventDefault(); yawRate = 0; pitchRate = 0; };
            
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        };

        // 変更: 上下ボタンの動きを逆に（上ボタンで上昇＝ピッチアップ(-turnSpeed) に設定）
        setupDpad('btn-up', 0, -turnSpeed);
        setupDpad('btn-down', 0, turnSpeed);
        setupDpad('btn-left', turnSpeed, 0);
        setupDpad('btn-right', -turnSpeed, 0);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') yawRate = turnSpeed;
            if (e.key === 'd' || e.key === 'ArrowRight') yawRate = -turnSpeed;
            // 変更: Wキー・上矢印で上昇
            if (e.key === 'w' || e.key === 'ArrowUp') pitchRate = -turnSpeed;
            if (e.key === 's' || e.key === 'ArrowDown') pitchRate = turnSpeed;
        });
        window.addEventListener('keyup', (e) => {
            if (['a', 'd', 'ArrowLeft', 'ArrowRight'].includes(e.key)) yawRate = 0;
            if (['w', 's', 'ArrowUp', 'ArrowDown'].includes(e.key)) pitchRate = 0;
        });

        // --- 4. レーダーとメインループ ---
        const radarCanvas = document.getElementById('radar');
        const ctx = radarCanvas.getContext('2d');
        const radarRange = 1000;

        function updateRadar() {
            ctx.clearRect(0, 0, 160, 160);
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(80, 80, 4, 0, Math.PI * 2);
            ctx.fill();

            objects.forEach(obj => {
                const dx = obj.mesh.position.x - planeGroup.position.x;
                const dz = obj.mesh.position.z - planeGroup.position.z;
                
                if (Math.abs(dx) < radarRange && Math.abs(dz) < radarRange) {
                    const radarX = 80 + (dx / radarRange) * 80;
                    const radarY = 80 + (dz / radarRange) * 80;
                    ctx.fillStyle = obj.isSymbol ? '#ff0000' : '#ffffff';
                    const size = obj.isSymbol ? 4 : 2;
                    ctx.fillRect(radarX - size/2, radarY - size/2, size, size);
                }
            });
        }

        const planeBox = new THREE.Box3();

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // 機体の移動とピッチ・ヨー回転
                planeGroup.rotateY(yawRate);
                planeGroup.rotateX(pitchRate);
                planeGroup.translateZ(currentSpeed);

                // 追加: 旋回時のロール（傾き）アニメーション
                const targetRoll = -yawRate * 15;
                planeVisual.rotation.z += (targetRoll - planeVisual.rotation.z) * 0.1;

                const relativeCameraOffset = new THREE.Vector3(0, 20, -50);
                const cameraOffset = relativeCameraOffset.applyMatrix4(planeGroup.matrixWorld);
                camera.position.lerp(cameraOffset, 0.1);
                camera.lookAt(planeGroup.position);

                if (planeGroup.position.y < 2) triggerGameOver();

                // 建物との衝突判定
                planeBox.setFromObject(planeGroup);
                for (let obj of objects) {
                    if (planeBox.intersectsBox(obj.box3)) {
                        triggerGameOver();
                        break;
                    }
                }

                // プレイヤーの武器連射処理
                if (isMGFiring && mgCooldown <= 0) {
                    fireMG();
                    mgCooldown = 5; // 機銃の間隔
                }
                if (mgCooldown > 0) mgCooldown--;

                if (isRocketFiring && rocketCooldown <= 0) {
                    fireRocket();
                    rocketCooldown = 15; // ロケット弾の間隔
                }
                if (rocketCooldown > 0) rocketCooldown--;

                // 対空砲（敵）の攻撃処理
                enemies.forEach(enemy => {
                    if (!enemy.active) return;
                    
                    const dist = enemy.mesh.position.distanceTo(planeGroup.position);
                    if (dist < 800) { // 射程距離
                        enemy.mesh.lookAt(planeGroup.position);
                        if (enemy.cooldown <= 0) {
                            const aaBulletGeo = new THREE.SphereGeometry(1.5, 4, 4);
                            const aaBulletMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                            const aaBullet = new THREE.Mesh(aaBulletGeo, aaBulletMat);
                            aaBullet.position.copy(enemy.mesh.position);
                            
                            const dir = new THREE.Vector3().subVectors(planeGroup.position, enemy.mesh.position).normalize();
                            scene.add(aaBullet);
                            enemyProjectiles.push({ mesh: aaBullet, velocity: dir.multiplyScalar(8), life: 150 });
                            
                            enemy.cooldown = 80; // 攻撃間隔
                        }
                    }
                    if (enemy.cooldown > 0) enemy.cooldown--;
                });
            }

            // 敵の弾の処理
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const p = enemyProjectiles[i];
                p.mesh.position.add(p.velocity);
                p.life--;
                
                let hit = false;
                if (!isGameOver && planeBox.containsPoint(p.mesh.position)) {
                    hit = true;
                    triggerGameOver();
                }

                if (hit || p.life <= 0) {
                    scene.remove(p.mesh);
                    enemyProjectiles.splice(i, 1);
                }
            }

            // プレイヤーの弾の処理
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.velocity);
                
                if (p.type === 'bomb') p.velocity.y -= 0.05; 
                p.life--;
                
                let hit = false;
                if (p.mesh.position.y <= 0) hit = true;

                // 弾と建物の当たり判定
                if (!hit) {
                    for (let obj of objects) {
                        if (obj.box3.containsPoint(p.mesh.position)) {
                            hit = true;
                            obj.mesh.material.color.setHex(0xff0000);
                            setTimeout(() => {
                                if (obj && obj.mesh) obj.mesh.material.color.setHex(obj.isSymbol ? 0x444444 : 0xaaaaaa);
                            }, 100);
                            break;
                        }
                    }
                }

                // 弾と対空砲の当たり判定（追加部分）
                if (!hit) {
                    for (let enemy of enemies) {
                        if (enemy.active && enemy.box3.containsPoint(p.mesh.position)) {
                            hit = true;
                            enemy.active = false;
                            enemy.mesh.visible = false; // 非表示で破壊を表現
                            
                            // 10秒後に復活
                            setTimeout(() => {
                                enemy.active = true;
                                enemy.mesh.visible = true;
                                enemy.cooldown = 50;
                            }, 10000);
                            break;
                        }
                    }
                }

                if (hit || p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            updateRadar();
            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('gameover').style.display = 'block';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
